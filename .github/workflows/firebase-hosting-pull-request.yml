name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    env:
      API_KEY: ${{ secrets.API_KEY }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      # Dependabot-triggered runs cannot read repository secrets. Deploy only
      # when the service account is actually available, otherwise the build
      # still runs and the workflow does not fail on the missing secret.
      HAS_DEPLOY_SECRETS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUICKSTART_1614336716847 != '' }}

    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'

    runs-on: ubuntu-latest
    permissions:
      deployments: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v3

      - name: Create GitHub deployment
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: chrnorm/deployment-action@v2.0.5
        id: deployment
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          environment-url: https://free-location-sheet-staging-fd228.web.app/
          environment: staging

      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1
        with:
          # ubuntu-26.04 only provides prebuilt binaries for the latest patch
          # of each series, so ask for the series instead of a fixed patch.
          ruby-version: '3.4'
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build
        run: |
          ruby settings_writer.rb
          npm i --legacy-peer-deps && npm run build:staging

      - name: deploy
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0.7.1
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUICKSTART_1614336716847 }}'
          channelId: live
          target: free-location-sheet-staging-fd228
          projectId: quickstart-1614336716847

      - name: Update deployment status (success)
        if: success() && env.HAS_DEPLOY_SECRETS == 'true'
        uses: chrnorm/deployment-status@v2.0.1
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          environment-url: https://free-location-sheet-staging-fd228.web.app/
          environment: staging
          state: 'success'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
